<!DOCTYPE html>
<html>
 
<head>
 
<meta charset="UTF-8">
 
<title>CubeSmart Unit Mapper</title>
 
<style>
 
body{
margin:0;
font-family:Arial;
overflow:hidden;
}
 
#toolbar{
 
height:60px;
background:#222;
color:white;
 
display:flex;
align-items:center;
gap:10px;
 
padding:10px;
 
}
 
#mapContainer{
 
position:relative;
 
overflow:auto;
 
height:calc(100vh - 60px);
 
background:#ddd;
 
}
 
#facility{
 
width:1600px;
 
display:block;
 
}
 
.unit{
 
position:absolute;
 
width:42px;
height:26px;
 
border:2px solid black;
 
display:flex;
align-items:center;
justify-content:center;
 
font-size:11px;
 
cursor:grab;
 
user-select:none;
 
background:#34c759;
 
z-index:100;
 
}
 
.unit:active{
cursor:grabbing;
}
 
.selected{
outline:4px solid blue;
}
 
#saveStatus{
 
margin-left:auto;
 
font-weight:bold;
 
}
 
</style>
 
</head>
 
<body>
 
<div id="toolbar">
 
<button onclick="saveCoords()">
Save Coordinates
</button>
 
<button onclick="exportCoords()">
Export JSON
</button>
 
<input
id="unitInput"
placeholder="Add Unit"
/>
 
<button onclick="addUnit()">
Add Unit
</button>
 
<div id="saveStatus">
Not Saved
</div>
 
</div>
 
<div id="mapContainer">
 
<img
id="facility"
src="facilitymap.png"
/>
 
</div>
 
<script>
 
let coords = {};
 
let active = null;
 
async function loadCoords(){
 
try{
 
const res =
await fetch(
"coordinates.json"
);
 
coords =
await res.json();
 
Object.keys(coords)
.forEach(createUnit);
 
}catch(e){
 
console.log(e);
 
}
 
}
 
function createUnit(unit){
 
const map =
document.getElementById(
"mapContainer"
);
 
const div =
document.createElement(
"div"
);
 
div.className =
"unit";
 
div.innerHTML =
unit;
 
div.dataset.unit =
unit;
 
div.style.left =
coords[unit].x + "px";
 
div.style.top =
coords[unit].y + "px";
 
div.style.width =
(coords[unit].w || 42) + "px";
 
div.style.height =
(coords[unit].h || 26) + "px";
 
enableDrag(div);
 
const resize =
document.createElement(
"div"
);
 
resize.style.position =
"absolute";
 
resize.style.right = "-6px";
resize.style.bottom = "-6px";
 
resize.style.width = "12px";
resize.style.height = "12px";
 
resize.style.background =
"black";
 
resize.style.cursor =
"nwse-resize";
 
resize.style.zIndex = "999";
 
div.appendChild(resize);
 
resize.addEventListener(
"mousedown",
e=>{
 
e.stopPropagation();
 
active = {
resize:true,
el:div
};
 
}
);
 
map.appendChild(div);
 
}
 
function addUnit(){
 
const input =
document.getElementById(
"unitInput"
);
 
const unit =
input.value.trim();
 
if(!unit) return;
 
coords[unit] = {
x:100,
y:100,
 w:42,
 h:26
};
 
createUnit(unit);
 
input.value="";
 
markUnsaved();
 
}
 
function enableDrag(el){
 
el.addEventListener(
"mousedown",
e=>{
 
active = {
el,
offsetX:e.offsetX,
offsetY:e.offsetY
};
 
}
);
 
}
 
document.addEventListener(
"mousemove",
e=>{

if(!active) return;

const map =
document.getElementById(
"mapContainer"
);

const rect =
map.getBoundingClientRect();

const unit =
active.el.dataset.unit;

if(active.resize){

const width =
e.clientX -
active.el.offsetLeft;

const height =
e.clientY -
active.el.offsetTop;

active.el.style.width =
width + "px";

active.el.style.height =
height + "px";

coords[unit].w = width;
coords[unit].h = height;

}else{

const x =
e.clientX -
rect.left +
map.scrollLeft -
active.offsetX;

const y =
e.clientY -
rect.top +
map.scrollTop -
active.offsetY;

active.el.style.left =
x+"px";

active.el.style.top =
y+"px";

coords[unit].x = x;
coords[unit].y = y;

}

markUnsaved();

}
);
 
const rect =
map.getBoundingClientRect();
 
const x =
e.clientX -
rect.left +
map.scrollLeft -
active.offsetX;
 
const y =
e.clientY -
rect.top +
map.scrollTop -
active.offsetY;
 
active.el.style.left =
x+"px";
 
active.el.style.top =
y+"px";
 
const unit =
active.el.dataset.unit;
 
coords[unit] = {
x,
y
};
 
markUnsaved();
 
}
);
 
document.addEventListener(
"mouseup",
()=>{
 
active = null;
 
}
);
 
function markUnsaved(){
 
document.getElementById(
"saveStatus"
).innerHTML =
"Unsaved Changes";
 
}
 
function saveCoords(){
 
localStorage.setItem(
"coords",
JSON.stringify(coords)
);
 
document.getElementById(
"saveStatus"
).innerHTML =
"Saved Locally";
 
}
 
function exportCoords(){
 
const data =
JSON.stringify(
coords,
null,
2
);
 
const blob =
new Blob(
[data],
{
type:"application/json"
}
);
 
const url =
URL.createObjectURL(
blob
);
 
const a =
document.createElement("a");
 
a.href = url;
 
a.download =
"coordinates.json";
 
a.click();
 
URL.revokeObjectURL(
url
);
 
}
 
window.onload=()=>{
 
const local =
localStorage.getItem(
"coords"
);
 
if(local){
 
coords =
JSON.parse(local);
 
Object.keys(coords)
.forEach(createUnit);
 
}else{
 
loadCoords();
 
}
 
};
 
</script>
 
</body>
 
</html>
