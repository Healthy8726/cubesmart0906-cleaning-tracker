<!DOCTYPE html>
<html>
 
<head>
 
<meta charset="UTF-8">
 
<title>CubeSmart Interactive Mapper</title>
 
<style>
 
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:#f0f0f0;
}
 
#toolbar{
 
height:70px;
 
background:#1f1f1f;
 
color:white;
 
display:flex;
 
align-items:center;
 
gap:10px;
 
padding:10px;
 
flex-wrap:wrap;
 
}
 
button{
 
padding:8px 12px;
 
cursor:pointer;
 
border:none;
 
border-radius:4px;
 
font-weight:bold;
 
}
 
input{
 
padding:8px;
 
width:120px;
 
}
 
#mapContainer{
 
position:relative;
 
overflow:auto;
 
height:calc(100vh - 70px);
 
background:#d9d9d9;
 
}
 
#facility{
 
width:2200px;
 
display:block;
 
}
 
.unit{
 
position:absolute;
 
border:2px solid black;
 
display:flex;
 
align-items:center;
 
justify-content:center;
 
background:#34c759;
 
color:black;
 
font-size:11px;
 
font-weight:bold;
 
cursor:grab;
 
user-select:none;
 
box-sizing:border-box;
 
overflow:hidden;
 
z-index:100;
 
min-width:20px;
 
min-height:20px;
 
}
 
.unit.selected{
 
outline:4px solid blue;
 
z-index:999;
 
}
 
.unit:active{
 
cursor:grabbing;
 
}
 
.resizeHandle{
 
position:absolute;
 
right:-6px;
 
bottom:-6px;
 
width:12px;
 
height:12px;
 
background:black;
 
cursor:nwse-resize;
 
z-index:1000;
 
border-radius:2px;
 
}
 
.selectionBox{
 
position:absolute;
 
border:2px dashed blue;
 
background:rgba(0,0,255,.1);
 
pointer-events:none;
 
z-index:5000;
 
}
 
#saveStatus{
 
margin-left:auto;
 
font-weight:bold;
 
}
 
.green{
background:#34c759;
}
 
.yellow{
background:#ffd60a;
}
 
.brown{
background:#8b5a2b;
color:white;
}
 
</style>
 
</head>
 
<body>
 
<div id="toolbar">
 
<button onclick="saveLocal()">
Save Local
</button>
 
<button onclick="exportCoords()">
Export JSON
</button>
 
<button onclick="clearSelection()">
Clear Selection
</button>
 
<button onclick="deleteSelected()">
Delete Selected
</button>
 
<button onclick="generateRow()">
Generate Row
</button>
 
<button onclick="duplicateSelected()">
Duplicate
</button>
 
<button onclick="markGreen()">
Green
</button>
 
<button onclick="markYellow()">
Yellow
</button>
 
<button onclick="markBrown()">
Brown
</button>
 
<input
id="unitInput"
placeholder="Add Unit"
/>
 
<button onclick="addUnit()">
Add Unit
</button>
 
<input
id="search"
placeholder="Search"
/>
 
<button onclick="searchUnit()">
Find
</button>
 
<div id="saveStatus">
Unsaved
</div>
 
</div>
 
<div id="mapContainer">
 
<img
id="facility"
src="facilitymap.png"
/>
 
</div>
 
<script>
 
let coords = {};
 
let active = null;
 
let selected = [];
 
let selectionBox = null;
 
let selectionStart = null;
 
async function loadCoords(){
 
try{
 
const res =
await fetch(
"coordinates.json"
);
 
coords =
await res.json();
 
Object.keys(coords)
.forEach(createUnit);
 
}catch(e){
 
console.log(e);
 
}
 
}
 
function createUnit(unit){
 
const map =
document.getElementById(
"mapContainer"
);
 
if(!coords[unit]){
 
coords[unit] = {
 
x:100,
y:100,
w:42,
h:26,
color:"green"
 
};
 
}
 
const div =
document.createElement("div");
 
div.className =
"unit "+
(coords[unit].color || "green");
 
div.innerHTML = unit;
 
div.dataset.unit = unit;
 
div.style.left =
coords[unit].x + "px";
 
div.style.top =
coords[unit].y + "px";
 
div.style.width =
coords[unit].w + "px";
 
div.style.height =
coords[unit].h + "px";
 
enableDrag(div);
 
div.addEventListener(
"click",
e=>{
 
if(e.shiftKey){
 
toggleSelect(div);
 
}
 
}
);
 
const resize =
document.createElement("div");
 
resize.className =
"resizeHandle";
 
resize.addEventListener(
"mousedown",
e=>{
 
e.stopPropagation();
 
active = {
resize:true,
el:div
};
 
}
);
 
div.appendChild(resize);
 
map.appendChild(div);
 
}
 
function addUnit(){
 
const input =
document.getElementById(
"unitInput"
);
 
const unit =
input.value.trim();
 
if(!unit) return;
 
coords[unit] = {
 
x:100,
y:100,
w:42,
h:26,
color:"green"
 
};
 
createUnit(unit);
 
input.value="";
 
markUnsaved();
 
}
 
function enableDrag(el){
 
el.addEventListener(
"mousedown",
e=>{
 
if(e.target.classList.contains(
"resizeHandle"
)) return;
 
active = {
 
el,
offsetX:e.offsetX,
offsetY:e.offsetY
 
};
 
}
);
 
}
 
document.addEventListener(
"mousemove",
e=>{
 
if(active){
 
const map =
document.getElementById(
"mapContainer"
);
 
const rect =
map.getBoundingClientRect();
 
const unit =
active.el.dataset.unit;
 
if(active.resize){
 
const width =
e.clientX -
active.el.offsetLeft;
 
const height =
e.clientY -
active.el.offsetTop;
 
active.el.style.width =
width + "px";
 
active.el.style.height =
height + "px";
 
coords[unit].w = width;
 
coords[unit].h = height;
 
}else{
 
const x =
e.clientX -
rect.left +
map.scrollLeft -
active.offsetX;
 
const y =
e.clientY -
rect.top +
map.scrollTop -
active.offsetY;
 
active.el.style.left =
x + "px";
 
active.el.style.top =
y + "px";
 
coords[unit].x = x;
 
coords[unit].y = y;
 
}
 
markUnsaved();
 
}
 
if(selectionBox){
 
const map =
document.getElementById(
"mapContainer"
);
 
const rect =
map.getBoundingClientRect();
 
const currentX =
e.clientX -
rect.left +
map.scrollLeft;
 
const currentY =
e.clientY -
rect.top +
map.scrollTop;
 
const x =
Math.min(
selectionStart.x,
currentX
);
 
const y =
Math.min(
selectionStart.y,
currentY
);
 
const w =
Math.abs(
currentX -
selectionStart.x
);
 
const h =
Math.abs(
currentY -
selectionStart.y
);
 
selectionBox.style.left =
x + "px";
 
selectionBox.style.top =
y + "px";
 
selectionBox.style.width =
w + "px";
 
selectionBox.style.height =
h + "px";
 
}
 
}
);
 
document.addEventListener(
"mouseup",
()=>{
 
active = null;
 
if(selectionBox){
 
const box =
selectionBox.getBoundingClientRect();
 
document
.querySelectorAll(".unit")
.forEach(unit=>{
 
const rect =
unit.getBoundingClientRect();
 
if(
 
rect.left < box.right &&
rect.right > box.left &&
rect.top < box.bottom &&
rect.bottom > box.top
 
){
 
selectUnit(unit);
 
}
 
});
 
selectionBox.remove();
 
selectionBox = null;
 
}
 
}
);
 
document.getElementById(
"mapContainer"
).addEventListener(
"mousedown",
e=>{
 
if(e.target.id !== "facility")
return;
 
clearSelection();
 
const map =
document.getElementById(
"mapContainer"
);
 
const rect =
map.getBoundingClientRect();
 
selectionStart = {
 
x:e.clientX -
rect.left +
map.scrollLeft,
 
y:e.clientY -
rect.top +
map.scrollTop
 
};
 
selectionBox =
document.createElement("div");
 
selectionBox.className =
"selectionBox";
 
selectionBox.style.left =
selectionStart.x+"px";
 
selectionBox.style.top =
selectionStart.y+"px";
 
map.appendChild(
selectionBox
);
 
}
);
 
function toggleSelect(div){
 
if(selected.includes(div)){
 
div.classList.remove(
"selected"
);
 
selected =
selected.filter(
x=>x!==div
);
 
}else{
 
selectUnit(div);
 
}
 
}
 
function selectUnit(div){
 
div.classList.add(
"selected"
);
 
selected.push(div);
 
}
 
function clearSelection(){
 
selected.forEach(x=>
x.classList.remove(
"selected"
)
);
 
selected=[];
 
}
 
function deleteSelected(){
 
selected.forEach(div=>{
 
delete coords[
div.dataset.unit
];
 
div.remove();
 
});
 
selected=[];
 
markUnsaved();
 
}
 
function duplicateSelected(){
 
selected.forEach(div=>{
 
const old =
coords[
div.dataset.unit
];
 
const newUnit =
prompt(
"New unit for "+
div.dataset.unit
);
 
if(!newUnit) return;
 
coords[newUnit] = {
 
x:old.x + 20,
y:old.y + 20,
w:old.w,
h:old.h,
color:old.color
 
};
 
createUnit(newUnit);
 
});
 
markUnsaved();
 
}
 
function markColor(color){
 
selected.forEach(div=>{
 
div.classList.remove(
"green",
"yellow",
"brown"
);
 
div.classList.add(
color
);
 
coords[
div.dataset.unit
].color = color;
 
});
 
markUnsaved();
 
}
 
function markGreen(){
markColor("green");
}
 
function markYellow(){
markColor("yellow");
}
 
function markBrown(){
markColor("brown");
}
 
function generateRow(){
 
const start =
parseInt(
prompt("Start Unit")
);
 
const end =
parseInt(
prompt("End Unit")
);
 
const direction =
prompt(
"horizontal or vertical?"
);
 
let x =
parseInt(
prompt("Start X")
);
 
let y =
parseInt(
prompt("Start Y")
);
 
const spacing =
parseInt(
prompt("Spacing")
) || 50;
 
for(
let i=start;
i<=end;
i++
){
 
coords[i] = {
 
x:x,
y:y,
w:42,
h:26,
color:"green"
 
};
 
createUnit(
String(i)
);
 
if(
direction ===
"vertical"
){
 
y += spacing;
 
}else{
 
x += spacing;
 
}
 
}
 
markUnsaved();
 
}
 
function searchUnit(){
 
const value =
document.getElementById(
"search"
).value.trim();
 
const unit =
document.querySelector(
'[data-unit="'+value+'"]'
);
 
if(unit){
 
unit.scrollIntoView({
 
behavior:"smooth",
block:"center",
inline:"center"
 
});
 
unit.classList.add(
"selected"
);
 
}
 
}
 
function markUnsaved(){
 
document.getElementById(
"saveStatus"
).innerHTML =
"Unsaved Changes";
 
}
 
function saveLocal(){
 
localStorage.setItem(
"coords",
JSON.stringify(coords)
);
 
document.getElementById(
"saveStatus"
).innerHTML =
"Saved Local";
 
}
 
function exportCoords(){
 
const data =
JSON.stringify(
coords,
null,
2
);
 
const blob =
new Blob(
[data],
{
type:"application/json"
}
);
 
const url =
URL.createObjectURL(
blob
);
 
const a =
document.createElement("a");
 
a.href = url;
 
a.download =
"coordinates.json";
 
a.click();
 
URL.revokeObjectURL(
url
);
 
document.getElementById(
"saveStatus"
).innerHTML =
"Exported JSON";
 
}
 
window.onload=()=>{
 
const local =
localStorage.getItem(
"coords"
);
 
if(local){
 
coords =
JSON.parse(local);
 
Object.keys(coords)
.forEach(createUnit);
 
}else{
 
loadCoords();
 
}
 
};
 
</script>
 
</body>
 
</html>
