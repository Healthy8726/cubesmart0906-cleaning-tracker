<!DOCTYPE html>
<html>
 
<head>
 
<meta charset="UTF-8">
 
<title>CubeSmart Cleaning Map</title>
 
<style>
 
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}
 
#toolbar{
padding:12px;
background:#222;
color:white;
display:flex;
gap:10px;
align-items:center;
}
 
#mapContainer{
position:relative;
overflow:auto;
height:92vh;
}
 
#facility{
width:1600px;
display:block;
}
 
.unit{
 
position:absolute;
 
border:2px solid black;
 
font-size:11px;
 
display:flex;
align-items:center;
justify-content:center;
 
cursor:pointer;
 
opacity:.8;
 
user-select:none;
}
 
.green{
background:#34c759;
}
 
.yellow{
background:#ffd60a;
}
 
.brown{
background:#8b5a2b;
color:white;
}
 
.selected{
outline:4px solid blue;
z-index:1000;
}
 
</style>
 
</head>
 
<body>
 
<div id="toolbar">
 
<button onclick="markSelected()">
Mark Selected Cleaned
</button>
 
<input
id="search"
placeholder="Search Unit"
/>
 
</div>
 
<div id="mapContainer">
 
<img
id="facility"
src="facilitymap.png"
/>
 
</div>
 
<script>
 
const CSV_URL =
"PASTE_YOUR_GOOGLE_SHEET_CSV_URL_HERE";
 
const coords = {
 
"415":{x:300,y:400},
"416":{x:350,y:400},
"417":{x:400,y:400}
 
};
 
let selected=[];
 
async function loadData(){
 
const res =
await fetch(CSV_URL);
 
const text =
await res.text();
 
const rows =
text.split("\n")
.slice(1);
 
rows.forEach(r=>{
 
const cols =
r.split(",");
 
const unit =
cols[0];
 
const last =
cols[1];
 
const notes =
cols[2];
 
const cleaner =
cols[3];
 
if(!coords[unit]) return;
 
const days =
daysSince(last);
 
const div =
document.createElement("div");
 
div.className =
"unit "+
getColor(days);
 
div.innerHTML =
unit;
 
div.style.left =
coords[unit].x+"px";
 
div.style.top =
coords[unit].y+"px";
 
div.style.width =
"42px";
 
div.style.height =
"26px";
 
div.onclick=()=>{
 
alert(
 
"Unit: "+unit+
 
"\nLast Cleaned: "+last+
 
"\nDays Since: "+days+
 
"\nNotes: "+notes+
 
"\nCleaner: "+cleaner
 
);
 
toggleSelect(
unit,
div
);
 
};
 
document
.getElementById(
"mapContainer"
)
.appendChild(div);
 
});
 
}
 
function daysSince(date){
 
return Math.floor(
(new Date()-new Date(date))
/86400000
);
 
}
 
function getColor(days){
 
if(days<=14)
return "green";
 
if(days<=29)
return "yellow";
 
return "brown";
 
}
 
function toggleSelect(
unit,
div
){
 
if(selected.includes(unit)){
 
selected=
selected.filter(
x=>x!==unit
);
 
div.classList.remove(
"selected"
);
 
}else{
 
selected.push(unit);
 
div.classList.add(
"selected"
);
 
}
 
}
 
function markSelected(){
 
alert(
"Selected Units:\n"+
selected.join(", ")
);
 
}
 
loadData();
 
</script>
 
</body>
 
</html>
